name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # repo pins vite 8 while plugin-react declares peer <=7; install matches local setup
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npm test
